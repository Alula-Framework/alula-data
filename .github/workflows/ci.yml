name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # alula calls this so a change there is tested against its largest
  # consumer on the pull request that causes it. alula 0.19.0 added an
  # associated value to `ConfigError.missingKey`; a default argument does not
  # apply to pattern matching, so this package's test target stopped
  # compiling — and nothing noticed, because nothing built it.
  workflow_call:
    inputs:
      alula_ref:
        description: "The alula commit to build this package against."
        type: string
        default: ""
  workflow_dispatch:

# The literal prefix is load-bearing. `github.workflow` and `github.ref`
# resolve to the *caller's* values inside a reusable workflow, so without it
# this group is identical to the one alula's own run already occupies when it
# calls us — and with cancel-in-progress, the called job can never be
# scheduled. That is why the `alula-data builds against this commit` job has
# never once appeared in an alula CI run.
concurrency:
  group: alula-data-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alula-data
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.3.3"]
    # The official image pins the exact patch release. swift-actions/setup-swift
    # only accepts a minor version, and "6.2" was resolving to 6.2.1.
    container: swift:${{ matrix.swift }}

    # The Postgres and Valkey suites skip without these, and a green run that
    # skipped every integration test proves almost nothing: the drivers are
    # the whole reason this package exists.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: alula
          POSTGRES_DB: alula_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      valkey:
        image: valkey/valkey:8-alpine
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
      # alula, hangar and swift-changeset are resolved by URL now, and
      # those repositories are private — so git needs the token. The sibling
      # checkouts this replaced existed only for the path dependencies that
      # v0.1.0 removed. This step disappears when the repositories go public.
      # The official Swift images are slim: no python3, which the manifest
      # repoint below runs on. alula-cli's workflow has installed it since it
      # was written; this one never did, and the step died with exit 127 the
      # first time it was ever reached.
      # `working-directory` overridden on both pre-checkout steps: the job
      # default is `alula-data/`, and that directory does not exist until
      # the checkout below creates it. Without this the very first step
      # failed in under a second with a missing-directory error, before
      # anything it was supposed to test had run.
      - name: Install python3
        working-directory: ${{ github.workspace }}
        run: apt-get update -qq && apt-get install -y -qq python3

      - name: Authenticate git for private package resolution
        working-directory: ${{ github.workspace }}
        run: |
          if [ -z "${{ secrets.SWIFTFLIGHT_CI_TOKEN }}" ]; then
            echo "::error::SWIFTFLIGHT_CI_TOKEN is not set."
            exit 1
          fi
          git config --global url."https://x-access-token:${{ secrets.SWIFTFLIGHT_CI_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global --add safe.directory '*'

      # Inside a reusable workflow the `github` context is the *caller's*, so a
      # bare checkout pulls alula and these steps run against the wrong
      # package — which is exactly how the called job came to report "no target
      # named 'AlulaDataCore'". Name the repository, and pick the ref: our own
      # commit on our own runs, main when alula drives.
      - uses: actions/checkout@v4
        with:
          repository: Alula-Framework/alula-data
          ref: ${{ inputs.alula_ref != '' && 'main' || github.sha }}
          # SwiftPM takes a package's identity from its directory name, and
          # inside a reusable workflow the workspace is named after the
          # *caller* — `/__w/alula/alula`. Checked out at the root, this
          # package therefore claimed the identity `alula`, collided with
          # its own dependency on alula, and failed with
          #   product 'AlulaScheduler' required by package 'alula'
          #   target 'AlulaSchedulerPostgresTests' not found in package 'alula'
          # which reads like alula dropped a product. Name the directory.
          path: alula-data

      # Only when called with a ref. A standalone run resolves alula by URL,
      # exactly as a consumer does; a called run must test the commit under
      # review instead, which is the difference between this wiring and one
      # that proves nothing.
      - name: Check out the alula commit under review
        if: inputs.alula_ref != ''
        uses: actions/checkout@v4
        with:
          repository: Alula-Framework/alula
          ref: ${{ inputs.alula_ref }}
          # Named `alula`, not `.alula-under-review`: a path dependency's
          # identity is its last path component, so the tidier name would
          # have resolved to `alula-under-review` and matched none of the
          # `package: "alula"` references in the targets below. The same
          # rule that broke the checkout above, one line further on.
          path: alula
          token: ${{ secrets.SWIFTFLIGHT_CI_TOKEN }}

      - name: Point the manifest at it
        if: inputs.alula_ref != ''
        run: |
          python3 - <<'PY'
          import re, pathlib
          manifest = pathlib.Path("Package.swift")
          text = manifest.read_text()
          def to_path(match):
              tail = match.group(1)
              traits = re.search(r'(traits:\s*\[[^\]]*\])', tail)
              args = 'path: "../alula"'
              if traits:
                  args += f", {traits.group(1)}"
              return f".package({args})"
          text = re.sub(
              r'\.package\(\s*url:\s*"https://github\.com/Alula-Framework/alula\.git"\s*,([^)]*)\)',
              to_path, text)
          manifest.write_text(text)
          PY
          grep -n 'path: "../alula"' Package.swift || {
            echo "::error::manifest rewrite did not take — the alula dependency was not repointed"
            exit 1
          }

      - name: Build (Alula's own warnings are errors)
        env:
          ALULA_STRICT_WARNINGS: "1"
        run: swift build --enable-all-traits

      # Fails rather than silently skipping: an unset variable here would
      # turn the integration suites off without turning the job red.
      - name: Verify the integration gates are armed
        # Written without bash-only indirect expansion: ${!var} is a syntax
        # error under sh, which fails the step for the wrong reason.
        run: |
          fail=0
          [ -n "$ALULA_POSTGRES_TEST_DATABASE_URL" ] || { echo "::error::ALULA_POSTGRES_TEST_DATABASE_URL is unset"; fail=1; }
          [ -n "$ALULA_MIGRATE_TEST_DATABASE_URL" ] || { echo "::error::ALULA_MIGRATE_TEST_DATABASE_URL is unset"; fail=1; }
          [ -n "$ALULA_VALKEY_TEST_URL" ] || { echo "::error::ALULA_VALKEY_TEST_URL is unset"; fail=1; }
          [ "$fail" = "0" ] || { echo "::error::integration tests would skip"; exit 1; }
        env:
          ALULA_POSTGRES_TEST_DATABASE_URL: postgres://postgres:alula@postgres:5432/alula_test
          ALULA_MIGRATE_TEST_DATABASE_URL: postgres://postgres:alula@postgres:5432/alula_test
          ALULA_VALKEY_TEST_URL: redis://valkey:6379

      - name: Test
        env:
          ALULA_POSTGRES_TEST_DATABASE_URL: postgres://postgres:alula@postgres:5432/alula_test
          ALULA_MIGRATE_TEST_DATABASE_URL: postgres://postgres:alula@postgres:5432/alula_test
          ALULA_VALKEY_TEST_URL: redis://valkey:6379
        run: ./CI/run-tests.sh

      # The lean configuration is a supported consumption mode, so it is
      # built too: this is what a consumer using only the container gets.
      # A root build compiles every target regardless of traits, so it cannot
      # verify the lean configuration. This builds an actual consumer and
      # fails if any gated dependency leaked into its resolution.
      - name: Lean consumer resolves no gated dependency
        run: ./CI/check-lean-consumer.sh

  lint:
    # Advisory only. The merged packages predate a shared .swift-format
    # config; the macro fixture suites in particular hold expected-expansion
    # string literals that a bulk reformat would corrupt. This job reports
    # drift without blocking merges until that reformat lands on its own.
    name: Format (advisory)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alula-data
    continue-on-error: true
    container: swift:6.3.3

    # The Postgres and Valkey suites skip without these, and a green run that
    # skipped every integration test proves almost nothing: the drivers are
    # the whole reason this package exists.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: alula
          POSTGRES_DB: alula_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      valkey:
        image: valkey/valkey:8-alpine
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          repository: Alula-Framework/alula-data
          ref: ${{ inputs.alula_ref != '' && 'main' || github.sha }}
          # SwiftPM takes a package's identity from its directory name, and
          # inside a reusable workflow the workspace is named after the
          # *caller* — `/__w/alula/alula`. Checked out at the root, this
          # package therefore claimed the identity `alula`, collided with
          # its own dependency on alula, and failed with
          #   product 'AlulaScheduler' required by package 'alula'
          #   target 'AlulaSchedulerPostgresTests' not found in package 'alula'
          # which reads like alula dropped a product. Name the directory.
          path: alula-data


      - name: Check formatting
        run: swift format lint --recursive --strict Sources Tests

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alula-data
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Alula-Framework/alula-data
          ref: ${{ inputs.alula_ref != '' && 'main' || github.sha }}
          # SwiftPM takes a package's identity from its directory name, and
          # inside a reusable workflow the workspace is named after the
          # *caller* — `/__w/alula/alula`. Checked out at the root, this
          # package therefore claimed the identity `alula`, collided with
          # its own dependency on alula, and failed with
          #   product 'AlulaScheduler' required by package 'alula'
          #   target 'AlulaSchedulerPostgresTests' not found in package 'alula'
          # which reads like alula dropped a product. Name the directory.
          path: alula-data

      # Every module with a .docc catalogue, each with --warnings-as-errors:
      # an unresolved symbol link, a doc comment naming a renamed parameter,
      # or a Topics entry pointing at a symbol that no longer exists all fail
      # the job. Documentation that nothing checks rots into documentation
      # that is wrong, which is worse than none.
      - name: Generate documentation
        env:
          ALULA_BUILD_DOCS: "1"
        run: |
          # The plugin *moves* its archive to --output-path, so the parent
          # has to exist first.
          mkdir -p ./docs
          for target in AlulaDataCore AlulaCache AlulaDataPostgres \
                        AlulaDataValkey AlulaCacheValkey AlulaDataTesting \
                        AlulaMigrate AlulaMigrateCore \
                        AlulaSchedulerPostgres AlulaPubSubValkey \
                        AlulaSessionsValkey AlulaRateLimitValkey; do
            echo "::group::$target"
            swift package --enable-all-traits \
              --allow-writing-to-directory "./docs/$target" \
              generate-documentation --target "$target" \
              --warnings-as-errors --output-path "./docs/$target"
            echo "::endgroup::"
          done

  macos:
    name: Build on macOS
    runs-on: macos-26
    defaults:
      run:
        working-directory: alula-data
    # Advisory, and the reason is upstream rather than here.
    #
    # apple/swift-configuration 1.2.0 — the latest release — does not
    # compile on Darwin: FileProvider.swift reaches for `Data.bytes`, which
    # exists on the Linux Foundation it was written against and not on the
    # Darwin one. Nothing in this package can fix that, and pinning to an
    # unreleased main is worse than knowing.
    #
    # So the job runs and reports honestly, and does not gate merges. The
    # moment upstream releases a fix, drop this line — the `platforms:
    # [.macOS(.v15)]` claim in Package.swift is either true or it is not,
    # and a permanently red required check just teaches people to ignore
    # CI.
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Alula-Framework/alula-data
          ref: ${{ inputs.alula_ref != '' && 'main' || github.sha }}
          # SwiftPM takes a package's identity from its directory name, and
          # inside a reusable workflow the workspace is named after the
          # *caller* — `/__w/alula/alula`. Checked out at the root, this
          # package therefore claimed the identity `alula`, collided with
          # its own dependency on alula, and failed with
          #   product 'AlulaScheduler' required by package 'alula'
          #   target 'AlulaSchedulerPostgresTests' not found in package 'alula'
          # which reads like alula dropped a product. Name the directory.
          path: alula-data

      # swiftly rather than swift-actions/setup-swift: this package declares
      # swift-tools-version 6.3, and setup-swift only indexes up to 6.2.
      # swiftly is also what the toolchain is managed with locally, so CI and
      # a developer's machine resolve the same way.
      - name: Install Swift
        run: |
          curl -fsSL -o swiftly.pkg https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          "$HOME/.swiftly/bin/swiftly" init --quiet-shell-followup --assume-yes --skip-install
          . "$HOME/.swiftly/env.sh"
          swiftly install 6.3.3 --use --assume-yes
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

      - name: Report the toolchain
        run: swift --version

      # Build only. macOS runners have no Docker and GitHub service
      # containers are Linux-only, so the driver suites — the whole point of
      # this package — cannot run here. Linux carries the test coverage,
      # gated so it cannot skip silently.
      - name: Build
        run: swift build --enable-all-traits

  # The starter templates are built against *this* commit, in alula-cli's own
  # workflow. Its `workflow_call` trigger exists for this, and until now
  # nothing called it: five renamed or removed APIs reached the templates
  # unnoticed, and `alula new` emitted a project that did not compile against
  # the versions it resolved. A breaking change here should fail on the pull
  # request that causes it, not in a new user's first ten minutes.
  templates:
    name: Starter templates
    # Only on our own runs. `github.sha` inside a reusable workflow is the
    # *caller's*, so when alula drives this workflow the line below passed
    # alula's commit as `alula_data_ref` and alula-cli tried to check out
    # alula-data at it:
    #
    #     fatal: remote error: upload-pack: not our ref 9bee9796…
    #
    # There is nothing to pass instead — this workflow cannot learn its own
    # sha when it is called — and nothing is lost by standing down: alula's
    # CI calls alula-cli directly, with the refs that are correct there.
    if: inputs.alula_ref == ''
    uses: Alula-Framework/alula-cli/.github/workflows/ci.yml@main
    with:
      caller: alula-data
      alula_data_ref: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit
